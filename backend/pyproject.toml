[project]
name = "trackfolio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "anthropic>=1.0",
    "bcrypt>=4.2",
    "httpx>=0.28",
    "pypdf>=5.0",
    "python-multipart>=0.0.20",
    "truststore>=0.9",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
